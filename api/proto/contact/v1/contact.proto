syntax = "proto3";

// Package contact.v1 adalah kontrak gRPC untuk mengelola kontak. Versi "v1"
// di nama package memungkinkan perubahan yang tidak kompatibel dirilis
// sebagai contact.v2 tanpa memutus client lama.
package contact.v1;

option go_package = "github.com/primestrider/golang-clean-architecture/internal/delivery/grpc/pb/contact/v1;contactv1";

// ContactService mengelola kontak milik user yang login. Autentikasi memakai
// metadata "authorization: Bearer <access_token>", sama seperti REST API.
service ContactService {
  rpc CreateContact(CreateContactRequest) returns (CreateContactResponse);
  rpc GetContact(GetContactRequest) returns (GetContactResponse);
  rpc UpdateContact(UpdateContactRequest) returns (UpdateContactResponse);
  rpc DeleteContact(DeleteContactRequest) returns (DeleteContactResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
}

// Contact adalah satu kontak.
message Contact {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  int32 version = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

// CreateContactRequest adalah input pembuatan kontak.
message CreateContactRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
}

// CreateContactResponse berisi kontak yang dibuat.
message CreateContactResponse {
  Contact contact = 1;
}

// GetContactRequest meminta satu kontak.
message GetContactRequest {
  string id = 1;
}

// GetContactResponse berisi kontak yang diminta.
message GetContactResponse {
  Contact contact = 1;
}

// UpdateContactRequest mengganti isi kontak. version wajib diisi dengan
// versi terakhir yang dibaca (optimistic locking).
message UpdateContactRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  int32 version = 6;
}

// UpdateContactResponse berisi kontak setelah diubah.
message UpdateContactResponse {
  Contact contact = 1;
}

// DeleteContactRequest menghapus satu kontak.
message DeleteContactRequest {
  string id = 1;
}

// DeleteContactResponse sengaja kosong.
message DeleteContactResponse {}

// ListContactsRequest mencari kontak dengan filter dan paging.
message ListContactsRequest {
  int32 page = 1;
  int32 size = 2;
  string name = 3;
  string email = 4;
  string phone = 5;
}

// ListContactsResponse berisi satu halaman kontak.
message ListContactsResponse {
  repeated Contact contacts = 1;
  int32 page = 2;
  int32 size = 3;
  int64 total_item = 4;
  int64 total_page = 5;
}
