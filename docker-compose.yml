# docker-compose untuk pengembangan lokal.
#
# Mode minimal (default):  docker compose up -d
#   mysql + migrate + web + worker. Fitur opsional dimatikan.
#
# Mode lengkap:            make compose-full
#   (= APP_ENV_FILE=deploy/full.env docker compose --profile full up -d)
#   menambah kafka, redis, s3 (SeaweedFS), mailpit, jaeger, dan prometheus, lalu
#   mengaktifkan fitur-fitur itu lewat deploy/full.env.

x-app: &app
  build: .
  image: golang-clean-architecture:local
  restart: unless-stopped
  env_file:
    - path: ${APP_ENV_FILE:-deploy/minimal.env}
      required: true
  environment:
    APP_DATABASE_HOST: mysql
    APP_DATABASE_USERNAME: gca
    APP_DATABASE_PASSWORD: gca
    APP_DATABASE_NAME: golang_clean_architecture
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: golang_clean_architecture
      MYSQL_USER: gca
      MYSQL_PASSWORD: gca
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      # Pakai TCP (127.0.0.1), bukan socket: saat inisialisasi, image MySQL
      # menjalankan server sementara yang hanya membuka socket. Dengan TCP,
      # healthcheck baru lolos setelah server yang sesungguhnya siap.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugca", "-pgca"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Menjalankan semua migrasi lalu berhenti. web dan worker menunggu
  # service ini selesai dengan sukses.
  migrate:
    image: migrate/migrate:v4.18.1
    volumes: [./db/migrations:/migrations:ro]
    command: ["-path", "/migrations", "-database", "mysql://gca:gca@tcp(mysql:3306)/golang_clean_architecture?multiStatements=true", "up"]
    depends_on:
      mysql:
        condition: service_healthy

  web:
    <<: *app
    ports: ["3000:3000", "9090:9090"]

  worker:
    <<: *app
    entrypoint: ["/app/worker"]
    ports: ["9091:9091"]

  # ---------------- profil "full" ----------------
  kafka:
    profiles: [full]
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    profiles: [full]
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  # Server S3-compatible untuk avatar. Aplikasi memakai client S3 generik,
  # jadi di production bisa diganti AWS S3, Cloudflare R2, atau MinIO.
  # Bucket dibuat otomatis oleh aplikasi saat startup.
  s3:
    profiles: [full]
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-ip.bind=0.0.0.0", "-master.volumeSizeLimitMB=64"]
    volumes:
      - ./deploy/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    ports: ["8333:8333"]

  mailpit:
    profiles: [full]
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]

  jaeger:
    profiles: [full]
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  prometheus:
    profiles: [full]
    image: prom/prometheus:v3.5.0
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9095:9090"]

volumes:
  mysql-data:
  s3-data:
