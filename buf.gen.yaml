# Generate kode Go dari file proto memakai plugin lokal (tanpa registry
# remote). Jalankan: make proto
version: v2
plugins:
  - local: protoc-gen-go
    out: internal/delivery/grpc/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/delivery/grpc/pb
    opt: paths=source_relative
